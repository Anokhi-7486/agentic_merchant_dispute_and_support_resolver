apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: emotionecho-backend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/emotionecho-backend
        env:
        - name: DATABASE_URL
          value: "PROJECT_ID:us-central1:DB_INSTANCE_NAME"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: emotionecho-frontend
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/emotionecho-frontend
        env:
        - name: VITE_API_URL
          value: "https://emotionecho-backend-url.a.run.app"
